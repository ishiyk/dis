<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="glean-artifact-type" content="visual_content">
<title>iDRAC10 ストレージ初期化（System Erase）手順ガイド</title>
<style>
:root{
  --artifact-background:#ffffff;
  --artifact-background-light:#f1f3f6;
  --artifact-background-mid:#e9ecf1;
  --artifact-border-light:#e3e6ec;
  --artifact-border-dark:#cdd2db;
  --artifact-primary-brand:#3559e6;
  --artifact-primary-highlight:#0d0f14;
  --artifact-primary-hover:#2442b8;
  --artifact-selected:#eaeefc;
  --artifact-text-primary:#11141a;
  --artifact-text-secondary:#5c6470;
  --artifact-text-highlight:#e8eefc;
  --artifact-positive-background:#e8f6ee;
  --artifact-positive-text:#11141a;
  --artifact-positive:#159a6a;
  --artifact-negative:#dc4c4c;
  --artifact-warn-bg:#fdf1e3;
  --artifact-warn-border:#e8c48f;
  --artifact-warn-text:#7a4a12;
  --artifact-code-bg:#0d0f14;
  --artifact-code-text:#eef0f4;
}
html[data-theme='dark']{
  --artifact-background:#0a0b0e;
  --artifact-background-light:#121419;
  --artifact-background-mid:#181b22;
  --artifact-border-light:#23262e;
  --artifact-border-dark:#343844;
  --artifact-primary-brand:#6a92ff;
  --artifact-primary-highlight:#f5f7fb;
  --artifact-primary-hover:#88a8ff;
  --artifact-selected:#1a2030;
  --artifact-text-primary:#eef0f4;
  --artifact-text-secondary:#9aa0ad;
  --artifact-text-highlight:#14213d;
  --artifact-positive-background:#0e2a1d;
  --artifact-positive-text:#c8f5da;
  --artifact-positive:#46d39a;
  --artifact-negative:#ff6b6b;
  --artifact-warn-bg:#2a1f10;
  --artifact-warn-border:#5c4420;
  --artifact-warn-text:#f0cf9a;
  --artifact-code-bg:#05060a;
  --artifact-code-text:#eef0f4;
}
*{box-sizing:border-box;}
body{
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:16px;font-weight:400;line-height:1.7;letter-spacing:-0.003em;
  background-color:var(--artifact-background);color:var(--artifact-text-primary);
  margin:0;padding:0;
}
.wrap{max-width:1040px;margin:0 auto;padding:56px 28px 100px;}
h1,h2,h3{line-height:1.15;letter-spacing:-0.015em;color:var(--artifact-text-primary);margin:0;}
h1{font-size:clamp(2rem,5vw,3.3rem);font-weight:300;}
h2{font-size:clamp(1.4rem,3vw,2rem);font-weight:400;}
h3{font-size:1.2rem;font-weight:600;}
.eyebrow{font-family:"SF Mono","Consolas",monospace;font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--artifact-primary-brand);}
.lead{color:var(--artifact-text-secondary);font-size:1.05rem;max-width:70ch;margin-top:18px;}
header.hero{border-bottom:1px solid var(--artifact-border-light);padding-bottom:40px;margin-bottom:12px;}
code,.mono{font-family:"SF Mono","Consolas",monospace;font-size:13.5px;}
.toc{position:sticky;top:0;background:var(--artifact-background);border-bottom:1px solid var(--artifact-border-light);
  display:flex;gap:6px;flex-wrap:wrap;padding:12px 0;margin-bottom:40px;z-index:20;}
.toc a{font-family:"SF Mono","Consolas",monospace;font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;
  color:var(--artifact-text-secondary);text-decoration:none;padding:6px 12px;border:1px solid var(--artifact-border-light);border-radius:6px;}
.toc a:hover{color:var(--artifact-primary-brand);border-color:var(--artifact-border-dark);}
section{margin-top:56px;scroll-margin-top:70px;}
.sec-label{font-family:"SF Mono","Consolas",monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--artifact-text-secondary);margin-bottom:10px;}
p{margin:12px 0;}
.callout{border:1px solid var(--artifact-warn-border);background:var(--artifact-warn-bg);color:var(--artifact-warn-text);
  border-radius:8px;padding:18px 20px;margin:24px 0;}
.callout strong{color:var(--artifact-warn-text);}
.callout .ic{font-weight:700;margin-right:8px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:22px;}
.card{background:var(--artifact-background-light);border:1px solid var(--artifact-border-light);border-radius:8px;padding:20px;}
.card .num{font-family:"SF Mono","Consolas",monospace;color:var(--artifact-primary-brand);font-size:13px;font-weight:600;}
.card h3{margin-top:8px;font-size:1.05rem;}
.card p{font-size:0.92rem;color:var(--artifact-text-secondary);margin:8px 0 0;}
ol.steps{list-style:none;counter-reset:step;padding:0;margin:24px 0 0;}
ol.steps>li{counter-increment:step;position:relative;padding:0 0 26px 56px;border-left:2px solid var(--artifact-border-light);margin-left:18px;}
ol.steps>li:last-child{border-left:2px solid transparent;}
ol.steps>li::before{content:counter(step);position:absolute;left:-18px;top:-4px;width:34px;height:34px;border-radius:50%;
  background:var(--artifact-primary-brand);color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:"SF Mono","Consolas",monospace;font-size:14px;font-weight:600;}
html[data-theme='dark'] ol.steps>li::before{color:#05060a;}
ol.steps>li h3{font-size:1.08rem;margin-bottom:6px;}
ol.steps>li p{margin:6px 0;color:var(--artifact-text-secondary);font-size:0.95rem;}
pre{background:var(--artifact-code-bg);color:var(--artifact-code-text);border-radius:8px;padding:16px 18px;overflow:auto;margin:14px 0;
  font-family:"SF Mono","Consolas",monospace;font-size:13px;line-height:1.6;}
pre .cmt{color:#8a93a6;}
pre .prompt{color:#6a92ff;}
table{width:100%;border-collapse:collapse;margin-top:22px;font-size:0.92rem;}
th{font-family:"SF Mono","Consolas",monospace;font-size:11.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--artifact-text-secondary);
  text-align:left;padding:12px 14px;border-bottom:1px solid var(--artifact-border-dark);}
td{padding:13px 14px;border-bottom:1px solid var(--artifact-border-light);vertical-align:top;color:var(--artifact-text-primary);}
td code{background:var(--artifact-background-mid);padding:2px 6px;border-radius:4px;}
.pill{display:inline-block;font-family:"SF Mono","Consolas",monospace;font-size:11px;padding:3px 9px;border-radius:20px;
  background:var(--artifact-selected);color:var(--artifact-primary-brand);letter-spacing:0.04em;}
.method-band{background:var(--artifact-text-highlight);border-radius:10px;padding:26px 28px;margin-top:22px;}
.method-band h3{color:var(--artifact-text-primary);}
.footnote{margin-top:60px;padding-top:24px;border-top:1px solid var(--artifact-border-light);color:var(--artifact-text-secondary);font-size:0.85rem;}
.footnote a{color:var(--artifact-primary-brand);}
.inline-note{font-size:0.86rem;color:var(--artifact-text-secondary);margin-top:6px;}
@media print{
  @page{size:auto !important;}
  body{margin:0;padding:0.4in 0.6in;background:#fff;print-color-adjust:exact;-webkit-print-color-adjust:exact;}
  .wrap{max-width:100% !important;width:100% !important;}
  .toc{display:none !important;}
  section,.card{break-inside:avoid;}
  *,*::before,*::after{animation:none !important;transition:none !important;}
  button,[role="button"]{display:none !important;}
}

.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;}
.gate-card{max-width:460px;width:100%;border:1px solid var(--artifact-border-light);background:var(--artifact-background-light);border-radius:12px;padding:40px 34px;}
.gate .eyebrow{font-family:"SF Mono","Consolas",monospace;font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--artifact-primary-brand);}
.gate-title{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:300;margin-top:14px;}
.gate-lead{color:var(--artifact-text-secondary);margin-top:12px;font-size:0.98rem;}
.gate-row{display:flex;gap:10px;margin-top:24px;}
.gate-row input{flex:1;padding:12px 14px;border:1px solid var(--artifact-border-dark);border-radius:8px;background:var(--artifact-background);color:var(--artifact-text-primary);font-size:0.98rem;}
.gate-row input:focus{outline:none;border-color:var(--artifact-primary-brand);}
.gate-row button{padding:12px 20px;border:none;border-radius:8px;background:var(--artifact-primary-brand);color:#fff;font-weight:600;font-size:0.95rem;cursor:pointer;}
.gate-row button:hover{background:var(--artifact-primary-hover);}
html[data-theme='dark'] .gate-row button{color:#05060a;}
.gate-err{color:var(--artifact-negative);font-size:0.9rem;margin-top:14px;min-height:1.2em;}
</style>
</head>
<body>
<div id="gate" class="gate" data-glean-id="password-gate">
  <div class="gate-card">
    <div class="eyebrow">PROTECTED · iDRAC10 SYSTEM ERASE</div>
    <h1 class="gate-title">パスワードが必要です</h1>
    <p class="gate-lead">この手順ガイドを表示するにはパスワードを入力してください。</p>
    <div class="gate-row">
      <input id="pw" type="password" placeholder="パスワードを入力" autocomplete="off" aria-label="パスワード" />
      <button id="unlock" type="button">表示する</button>
    </div>
    <p id="err" class="gate-err" role="alert"></p>
  </div>
</div>

<div class="wrap" id="content" style="display:none;"></div>

  function b64ToBytes(b64){
    var bin = atob(b64);
    var arr = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  async function tryUnlock(){
    var errEl = document.getElementById('err');
    var pw = document.getElementById('pw').value;
    errEl.textContent = '';
    if (!pw){ errEl.textContent = 'パスワードを入力してください。'; return; }
    try {
      var enc = new TextEncoder();
      var keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(pw), {name:'PBKDF2'}, false, ['deriveKey']
      );
      var key = await crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:b64ToBytes(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'},
        keyMaterial,
        {name:'AES-GCM', length:256},
        false,
        ['decrypt']
      );
      var plainBuf = await crypto.subtle.decrypt(
        {name:'AES-GCM', iv:b64ToBytes(PAYLOAD.iv)},
        key,
        b64ToBytes(PAYLOAD.ct)
      );
      var html = new TextDecoder().decode(plainBuf);
      var content = document.getElementById('content');
      content.innerHTML = html;
      content.style.display = '';
      document.getElementById('gate').style.display = 'none';
      registerPdf();
    } catch(e){
      errEl.textContent = 'パスワードが正しくありません。';
    }
  }

  document.getElementById('unlock').addEventListener('click', tryUnlock);
  document.getElementById('pw').addEventListener('keydown', function(ev){
    if (ev.key === 'Enter'){ ev.preventDefault(); tryUnlock(); }
  });

  function registerPdf(){
    window.GleanBridge.postMessage({
      actionId:'export-pdf',
      type:'glean-add-menu',
      metadata:{label:'Export as PDF',icon:'export'}
    });
    window.GleanBridge.onMessage('action',function(data){
      if(data.actionId==='export-pdf') window.print();
    });
  }
</script>
